<svg viewBox="0 0 1600 1000" width="1600" height="1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A rooftop router beams signal over a Nairobi skyline; a customer pays by M-Pesa and the shillings flow into a ledger, each sorted into its own row.">
  <defs>
    <style>
      .ink   { fill: #141414; }
      .paper { fill: #e4e3e0; }
      .white { fill: #ffffff; }
      .money { fill: #228b22; }
      .s-ink  { fill: none; stroke: #141414; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .s-ink-t{ fill: none; stroke: #141414; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .s-money{ fill: none; stroke: #228b22; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .lbl   { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; fill: #141414; font-weight: 700; }
      .lbl-w { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; fill: #ffffff; font-weight: 700; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect class="paper" x="0" y="0" width="1600" height="1000"/>

  <!-- ============ NAIROBI SKYLINE (ink silhouette baseline) ============ -->
  <g class="ink">
    <rect x="0"    y="880" width="1600" height="120"/>
    <rect x="60"   y="792" width="120" height="90"/>
    <rect x="200"  y="828" width="90"  height="54"/>
    <rect x="820"  y="808" width="150" height="74"/>
    <rect x="1000" y="838" width="86"  height="44"/>
    <rect x="1250" y="800" width="120" height="82"/>
    <rect x="1400" y="836" width="120" height="46"/>
    <!-- windows -->
    <g fill="#e4e3e0">
      <rect x="86"  y="814" width="16" height="16"/><rect x="120" y="814" width="16" height="16"/>
      <rect x="86"  y="846" width="16" height="16"/><rect x="120" y="846" width="16" height="16"/>
      <rect x="846" y="830" width="18" height="18"/><rect x="886" y="830" width="18" height="18"/><rect x="926" y="830" width="18" height="18"/>
      <rect x="1276" y="822" width="16" height="16"/><rect x="1312" y="822" width="16" height="16"/>
      <rect x="1276" y="852" width="16" height="16"/><rect x="1312" y="852" width="16" height="16"/>
    </g>
    <!-- rooftop water tanks + antenna -->
    <rect x="228" y="800" width="34" height="28" rx="4"/>
    <rect x="1030" y="812" width="26" height="26" rx="4"/>
  </g>

  <!-- ============ ROOFTOP ACCESS POINT + SIGNAL ============ -->
  <!-- signal arcs radiating out (broadcast) -->
  <g>
    <path class="s-money" style="opacity:0.9" d="M 980 300 A 190 190 0 0 1 1300 300"/>
    <path class="s-money" style="opacity:0.6" d="M 930 300 A 260 260 0 0 1 1350 300"/>
    <path class="s-money" style="opacity:0.35" d="M 880 300 A 330 330 0 0 1 1400 300"/>
  </g>
  <!-- mast on a rooftop plinth -->
  <g>
    <rect class="ink" x="1120" y="300" width="40" height="120"/>
    <rect class="white" x="1112" y="256" width="56" height="52" rx="6" stroke="#141414" stroke-width="5"/>
    <circle class="money" cx="1140" cy="282" r="11"/>
    <line class="s-ink" x1="1140" y1="256" x2="1140" y2="222"/>
    <circle class="money" cx="1140" cy="212" r="9"/>
    <!-- rooftop the mast stands on -->
    <rect class="ink" x="1064" y="418" width="152" height="16"/>
  </g>

  <!-- ============ COIN FLOW: phone -> ledger ============ -->
  <path class="s-money" style="stroke-dasharray: 3 18; stroke-width:6; opacity:0.85"
        d="M 470 470 C 640 360, 860 560, 1040 560"/>
  <g>
    <!-- coins in flight -->
    <g transform="translate(560,406)"><circle class="money" r="30"/><circle cx="0" cy="0" r="30" fill="none" stroke="#ffffff" stroke-width="3"/><text class="lbl-w" x="0" y="7" font-size="20" text-anchor="middle">KSh</text></g>
    <g transform="translate(760,470)"><circle class="money" r="30"/><circle cx="0" cy="0" r="30" fill="none" stroke="#ffffff" stroke-width="3"/><text class="lbl-w" x="0" y="7" font-size="20" text-anchor="middle">KSh</text></g>
    <g transform="translate(950,556)"><circle class="money" r="30"/><circle cx="0" cy="0" r="30" fill="none" stroke="#ffffff" stroke-width="3"/><text class="lbl-w" x="0" y="7" font-size="20" text-anchor="middle">KSh</text></g>
  </g>

  <!-- ============ PHONE (customer pays by M-Pesa) ============ -->
  <g transform="rotate(-7 340 560)">
    <rect class="ink"   x="228" y="392" width="232" height="392" rx="34"/>
    <rect class="white" x="242" y="406" width="204" height="364" rx="24"/>
    <rect class="ink"   x="312" y="420" width="64"  height="10" rx="5"/>
    <!-- success tick -->
    <circle class="money" cx="344" cy="536" r="66"/>
    <path d="M 314 538 l 22 24 l 42 -50" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- labels -->
    <text class="lbl" x="344" y="648" font-size="26" text-anchor="middle">PAID</text>
    <text class="lbl" x="344" y="686" font-size="20" text-anchor="middle" style="opacity:.6">M-PESA · KSH 50</text>
  </g>

  <!-- ============ LEDGER (every shilling attributed) ============ -->
  <g>
    <rect class="white" x="1064" y="470" width="452" height="352" rx="8" stroke="#141414" stroke-width="5"/>
    <!-- title bar -->
    <rect class="ink" x="1064" y="470" width="452" height="52" rx="8"/>
    <rect class="ink" x="1064" y="500" width="452" height="22"/>
    <text class="lbl-w" x="1092" y="504" font-size="22">LEDGER</text>
    <circle class="money" cx="1486" cy="496" r="9"/>

    <!-- rows: client dot + attributed green bar + amount -->
    <g>
      <!-- row 1 -->
      <circle class="ink" cx="1100" cy="574" r="9"/>
      <rect class="money" x="1128" y="565" width="240" height="18" rx="4"/>
      <text class="lbl" x="1500" y="581" font-size="20" text-anchor="end" style="opacity:.75">+50</text>
      <!-- row 2 -->
      <circle class="ink" cx="1100" cy="626" r="9"/>
      <rect class="money" x="1128" y="617" width="300" height="18" rx="4"/>
      <text class="lbl" x="1500" y="633" font-size="20" text-anchor="end" style="opacity:.75">+100</text>
      <!-- row 3 -->
      <circle class="ink" cx="1100" cy="678" r="9"/>
      <rect class="money" x="1128" y="669" width="180" height="18" rx="4"/>
      <text class="lbl" x="1500" y="685" font-size="20" text-anchor="end" style="opacity:.75">+30</text>
      <!-- row 4 -->
      <circle class="ink" cx="1100" cy="730" r="9"/>
      <rect class="money" x="1128" y="721" width="270" height="18" rx="4"/>
      <text class="lbl" x="1500" y="737" font-size="20" text-anchor="end" style="opacity:.75">+80</text>
    </g>

    <!-- footer total -->
    <line class="s-ink-t" x1="1092" y1="770" x2="1488" y2="770" style="opacity:.25"/>
    <text class="lbl" x="1092" y="800" font-size="20" style="opacity:.55">ATTRIBUTED</text>
    <text class="lbl" x="1500" y="800" font-size="24" text-anchor="end">KSH 260</text>
  </g>
</svg>
